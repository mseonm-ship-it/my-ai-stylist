<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#147ee8"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-1024.png"><title>파랑새 스타일리스트</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="hero"><div class="brand"><img class="mascot" src="parangbird-stylist.jpg" alt="파랑새 스타일리스트">
<div><div class="eyebrow">🐦 PARANGBIRD STYLIST</div><h1>오늘 뭐 입지? 🕶️</h1>
<p>내 옷장을 먼저 활용하는 나만의 AI 패션 스타일리스트</p></div></div>
<button id="demoBtn" class="ghost">샘플 옷장 넣기</button></header>
<main>
<section class="panel"><h2>🎨 나의 컬러 프로필</h2><p class="muted">현재는 직접 설정하는 MVP입니다.</p>
<div class="row"><label>톤<select id="tone"><option value="cool">쿨톤 ❄️</option><option value="warm">웜톤 ☀️</option><option value="neutral">뉴트럴</option></select></label>
<label>세부 타입<select id="season"><option>여름 쿨톤</option><option>겨울 쿨톤</option><option>봄 웜톤</option><option>가을 웜톤</option></select></label></div></section>
<section class="panel"><div class="section-head"><div><h2>👕 내 옷장</h2><p class="muted">아이템을 추가하면 브라우저에 저장됩니다.</p></div><button id="clearBtn" class="danger">전체 삭제</button></div>
<form id="wardrobeForm" class="form"><input id="name" required placeholder="예: 파란색 반팔티">
<select id="category"><option>상의</option><option>하의</option><option>아우터</option><option>신발</option><option>모자</option><option>가방</option><option>액세서리</option></select>
<select id="color"><option value="blue">파란색 💙</option><option value="navy">네이비 🔵</option><option value="black">검정 🖤</option><option value="white">화이트 🤍</option><option value="gray">회색 🩶</option><option value="beige">베이지 🤎</option><option value="khaki">카키 🫒</option><option value="olive">올리브 🫒</option><option value="red">레드 ❤️</option></select>
<button class="primary">+ 추가</button></form><div id="wardrobe" class="wardrobe"></div></section>
<section class="panel"><div class="section-head"><div><h2>✨ 오늘의 코디</h2><p class="muted">파랑새가 내 옷장과 컬러 프로필을 기준으로 제안합니다.</p></div><button id="recommendBtn" class="primary">코디 3개 추천</button></div>
<div id="looks" class="looks empty">옷장을 등록하고 추천 버튼을 눌러보세요.</div></section>
</main><footer>🐦 <strong>파랑새 스타일리스트</strong> · My Personal AI Stylist</footer>
<script src="app.js"></script></body></html>
